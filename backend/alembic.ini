# Alembic configuration — config only, no migration scripts yet.

[alembic]
# Path to migration environment, relative to this file.
script_location = app/db/migrations

# Prepend the backend root to sys.path so env.py can import the `app` package.
prepend_sys_path = .

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps.
timezone = UTC

# The database URL is resolved at runtime in app/db/migrations/env.py from
# application settings (DATABASE_URL), so it is intentionally left blank here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
