[project]
name = "bright-day-backend"
version = "0.1.0"
description = "Bright Day backend — FastAPI service (API + AI processing)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "supabase>=2.15",
    "pyjwt[crypto]>=2.9",
    "stripe>=10.0",
    "faster-whisper>=1.0",
    "openai>=1.30",
    "tenacity>=8.3",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "httpx>=0.27",
    "soundfile>=0.12",
    "numpy>=1.26",
    "kokoro-onnx>=0.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
